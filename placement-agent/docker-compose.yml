services:
  db:
    image: postgres:16-alpine
    container_name: placement_db
    environment:
      POSTGRES_USER: placement_agent
      POSTGRES_PASSWORD: placement_agent
      POSTGRES_DB: placement_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build: .
    container_name: placement_agent
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
