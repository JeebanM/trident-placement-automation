name: Trident Monitor Pipeline

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment (self-hosted or ubuntu-latest)'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  run-monitor:
    runs-on: ${{ github.event.inputs.runner || vars.RUNNER_TYPE || 'self-hosted' }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./placement-agent
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline
      working-directory: ./placement-agent
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
      run: |
        python run_monitor.py
